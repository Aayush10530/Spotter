services:
  - type: web
    name: spotter-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn core.wsgi --bind 0.0.0.0:$PORT"
    preDeployCommand: "python manage.py migrate --noinput"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ORS_API_KEY
        sync: false
